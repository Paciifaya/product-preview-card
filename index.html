<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@400;500;700&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">

    <title>Gabrielle Essence — Product Card</title>
</head>
<body>

    <main>

      <div class="product-card">

        <div class="product-card__image">
            <img  src="images/image-product-desktop.jpg"
          alt="Gabrielle Chanel perfume bottle surrounded by green leaves">
        </div>

        <div class="product-card__content">

             <p class="product-card__category">Perfume</p>

              <h1 id="product-title">
                Gabrielle Essence Eau De Parfum
              </h1>
      
               <p class="product-card__description">
                  A floral, solar and voluptuous interpretation composed by
                  Olivier Polge, Perfumer-Creator for the House of CHANEL.
               </p>

           <div class="product-card__prices">

          <span class="sr-only">Current price:</span>
          <span class="product-card__price">$149.99</span>

          <span class="sr-only">Original price:</span>
          <s class="product-card__old-price">$169.99</s>

        </div>
          
        <button class="product-card__button" type="button">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 3h2l3 12h11l3-9H6" />
            <path d="M8 15l-1 3h13" />
            <circle cx="9" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
          </svg>

          <span>Add to Cart</span>

        </button>


        </div>

      </div>

    </main>
  


    
</body>
</html>
